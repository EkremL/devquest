spring.application.name=devquest
server.address=127.0.0.1
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never

# Run from backend/; the optional local file is ignored by Git.
spring.config.import=optional:file:./config/application-local.properties
spring.datasource.url=jdbc:postgresql://127.0.0.1:${DEVQUEST_DB_PORT:5432}/devquest_db?connectTimeout=5&socketTimeout=5
spring.datasource.username=${DEVQUEST_DB_USERNAME:devquest_app}
spring.datasource.password=${DEVQUEST_DB_PASSWORD}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=devquest
spring.sql.init.mode=never

spring.flyway.enabled=true
spring.flyway.default-schema=devquest
spring.flyway.schemas=devquest
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
